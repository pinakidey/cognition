name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Test & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Apply D1 schema migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: worker
          command: d1 execute remediation-db --remote --file=src/db/schema.sql

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            DEVIN_API_KEY
            GH_TOKEN
            SLACK_BOT_TOKEN
            SLACK_SIGNING_SECRET
            ADMIN_API_KEY
            SLACK_CHANNEL_IDS
            ALLOWED_REPOS
            APPROVAL_ALLOWLIST
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          SLACK_CHANNEL_IDS: ${{ vars.SLACK_CHANNEL_IDS }}
          ALLOWED_REPOS: ${{ vars.ALLOWED_REPOS }}
          APPROVAL_ALLOWLIST: ${{ vars.APPROVAL_ALLOWLIST }}
