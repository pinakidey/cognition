name = "devin-remediation-service"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "remediation-db"
database_id = "f6ce4959-8aa1-471d-9f39-62dfc87d6a12"

[triggers]
crons = ["*/1 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# GITHUB_REPOS, SLACK_CHANNEL_IDS, and APPROVAL_ALLOWLIST are managed
# as GitHub repo variables and injected during deploy.
